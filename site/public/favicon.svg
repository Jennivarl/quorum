<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The Quorum mark: eight units in a ring, five filled, three outlined.
    A quorum, just barely.

    Drawn heavier than the in-page logo because a favicon renders at 16px,
    where thin strokes disappear. The ring radius is 12 rather than 13 so
    the units stay inside the box at this weight.

    Theme-aware: browsers render favicons against their own chrome, which
    may be light or dark, so the ink colour has to follow.
  -->
  <style>
    .unit { fill: #14161A; }
    .out  { fill: none; stroke: #0A6E9C; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .unit { fill: #E6E8EC; }
      .out  { stroke: #4FC0EC; }
    }
  </style>

  <circle class="unit" cx="16"    cy="4"     r="3.4"/>
  <circle class="unit" cx="24.49" cy="7.51"  r="3.4"/>
  <circle class="unit" cx="28"    cy="16"    r="3.4"/>
  <circle class="unit" cx="24.49" cy="24.49" r="3.4"/>
  <circle class="unit" cx="16"    cy="28"    r="3.4"/>

  <circle class="out"  cx="7.51"  cy="24.49" r="2.6"/>
  <circle class="out"  cx="4"     cy="16"    r="2.6"/>
  <circle class="out"  cx="7.51"  cy="7.51"  r="2.6"/>
</svg>
