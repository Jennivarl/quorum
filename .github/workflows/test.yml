name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest test/ -q

      # The bundle is what actually deploys, so a stale one means the code
      # under review and the code on chain are different. test_contract_surface
      # regenerates and compares, but this fails the build loudly if the
      # committed file was never refreshed.
      - name: Bundle is current
        run: |
          python deploy/build_bundle.py
          git diff --exit-code -- contracts/quorum_bundle.py

  site:
    name: Site build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      # Runs tsc --noEmit first, so a type error fails here rather than
      # shipping a broken page.
      - run: npm run build
